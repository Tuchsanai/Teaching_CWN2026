# docker-compose.yaml — multi-account-devtool (SSH + JupyterLab + Docker-in-Docker
#                       + Claude Code / Codex CLI หลายบัญชี + Playwright MCP)
#
#   docker compose up -d          # ใช้ image tuchsanai/multi-account-devtool:2569_1
#   docker compose up -d --build  # build จาก Dockerfile ในโฟลเดอร์นี้แทน
#   docker compose down           # ลบ container — ล็อกอินทุกบัญชียังอยู่ใน volume ai-accounts
#   docker compose down -v        # ลบ volume ด้วย = ล็อกอินหาย ต้องล็อกอินใหม่ทุกบัญชี
#
# ในเครื่อง: yolo1..yolo5 (Claude Code), cyolo1..cyolo5 (Codex CLI) — ดู login-guide.md
#
# ปรับค่าได้ผ่าน environment หรือไฟล์ .env ข้าง ๆ (ทุกค่ามี default):
#   CONTAINER_NAME=multi-account-devtool  SSH_PORT=2223  JUPYTER_PORT=8886  JUPYTER_PASSWORD=
#   DEVTOOLS_ENV_FILE=/root/workspace/DGX_2024/.env   (ไฟล์ env ส่วนตัว ไม่มีก็รันได้)

services:
  multi-account-devtool:
    image: tuchsanai/multi-account-devtool:2569_1
    build: .
    container_name: ${CONTAINER_NAME:-multi-account-devtool}
    hostname: multi-account-devtool
    privileged: true            # จำเป็นสำหรับ Docker-in-Docker (dockerd ข้างใน)
    stdin_open: true            # -i
    tty: true                   # -t  → start.sh จะเปิด bash ให้เมื่อ attach
    restart: unless-stopped
    env_file:                   # credential ส่วนตัว (HF_TOKEN, GITHUB_TOKEN, ...) — ไม่มีไฟล์ก็รันได้
      - path: ${DEVTOOLS_ENV_FILE:-/root/workspace/DGX_2024/.env}
        required: false
    environment:
      JUPYTER_PASSWORD: ${JUPYTER_PASSWORD:-}   # ว่าง = JupyterLab ไม่ถามรหัสผ่าน
    ports:
      - "${SSH_PORT:-2223}:22"        # SSH        → ssh root@localhost -p 2223 (password: passwd)
                                      #              ssh -i Devtool_SSH/devtoolSSH root@localhost -p 2223 (key)
      - "${JUPYTER_PORT:-8886}:8888"  # JupyterLab → http://localhost:8886  (ไม่มีรหัสผ่าน)
    volumes:
      - ./workspace:/workspace              # งานของนักศึกษาอยู่บน host ไม่หายเมื่อลบ container
      - ai-accounts:/root/ai-accounts       # credential/config/session ทุกบัญชี + shared (skills, mcp.json)
      - multi-account-dind:/var/lib/docker  # image/container ของ Docker-in-Docker
      - ./Devtool_SSH:/etc/devtools/ssh     # devtoolSSH(.pub) → start.sh ใส่ .pub ใน authorized_keys (ว่าง = สร้างให้)

volumes:
  ai-accounts:
  multi-account-dind:
