<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านค้า</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;color:#1b1b1b;background:#fff;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:1.6rem;margin:8px 0}
h2{font-size:1.2rem}
ul{list-style:none;padding:0;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card,.line{border:1px solid #767676;border-radius:8px;padding:8px;overflow-wrap:anywhere}
.line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{min-height:32px;min-width:32px;padding:4px 10px;font:inherit;border:1px solid #1b1b1b;border-radius:6px;background:#0b5a4a;color:#fff;cursor:pointer}
button:disabled{background:#595959;cursor:not-allowed}
input{min-height:32px;font:inherit;padding:4px 8px;border:1px solid #1b1b1b;border-radius:6px;max-width:100%}
:focus-visible{outline:3px solid #b3261e;outline-offset:2px}
#msg{color:#8c1d18;min-height:1.5em}
</style>
</head>
<body>
<main>
<h1 id="shop"></h1>
<h2>สินค้า</h2>
<ul id="items" class="grid"></ul>
<h2 id="cartTitle">ตะกร้า (0)</h2>
<p id="empty">ตะกร้าว่าง</p>
<ul id="cart"></ul>
<p><label for="code">โค้ดส่วนลด</label> <input id="code" autocomplete="off"> <button id="apply" type="button">ใช้โค้ด</button> <button id="clear" type="button">ลบโค้ด</button></p>
<p id="msg" role="status" aria-live="polite"></p>
<p id="sub"></p><p id="off"></p><p id="ship"></p><p id="net"></p>
<p><button id="order" type="button">สั่งซื้อ</button></p>
</main>
<script>
const CFG = __CFG__;
const KEY = 'shop-state-v1';
const $ = id => document.getElementById(id);
const money = s => '฿' + Math.floor(s / 100).toLocaleString('en-US') + '.' + String(s % 100).padStart(2, '0');
const half = (num, den) => Math.floor((2 * num + den) / (2 * den));
let S = { cart: {}, code: null, orders: 0 };
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && typeof d === 'object' && !Array.isArray(d)) {
      const cart = {};
      if (d.cart && typeof d.cart === 'object') for (const i of CFG.items) { const q = d.cart[i.name]; if (Number.isInteger(q) && q > 0 && q <= CFG.maxQty) cart[i.name] = q; }
      S = { cart, code: [CFG.pct.code, CFG.fixed.code].includes(d.code) ? d.code : null, orders: Number.isInteger(d.orders) && d.orders >= 0 ? d.orders : 0 };
    }
  } catch (e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const subtotal = () => CFG.items.reduce((s, i) => s + i.price * (S.cart[i.name] || 0), 0);
function discount(sub) { if (S.code === CFG.pct.code) return half(sub * CFG.pct.pct, 100); if (S.code === CFG.fixed.code) return sub >= CFG.fixed.min ? CFG.fixed.off : 0; return 0; }
const MINMSG = 'โค้ดนี้ใช้ได้เมื่อยอดสินค้าตั้งแต่ ' + money(CFG.fixed.min);
function render(msg) {
  let sub = subtotal();
  if (S.code === CFG.fixed.code && sub < CFG.fixed.min) { S.code = null; msg = MINMSG; }
  const off = discount(sub), n = Object.values(S.cart).reduce((a, b) => a + b, 0);
  const ship = n === 0 ? 0 : (sub - off >= CFG.free ? 0 : CFG.ship);
  $('cartTitle').textContent = 'ตะกร้า (' + n + ')';
  $('empty').hidden = n > 0;
  const ul = $('cart'); ul.textContent = '';
  for (const i of CFG.items) { const q = S.cart[i.name]; if (!q) continue;
    const li = document.createElement('li'); li.className = 'line';
    const t = document.createElement('span'); t.textContent = i.name + ' × ' + q + ' = ' + money(i.price * q);
    const m = document.createElement('button'); m.type = 'button'; m.textContent = '−'; m.setAttribute('aria-label', 'ลด ' + i.name); m.onclick = () => change(i.name, -1);
    const p = document.createElement('button'); p.type = 'button'; p.textContent = '+'; p.setAttribute('aria-label', 'เพิ่ม ' + i.name); p.onclick = () => change(i.name, 1);
    li.append(t, m, p); ul.append(li); }
  $('sub').textContent = 'ยอดสินค้า ' + money(sub);
  $('off').textContent = 'ส่วนลด -' + money(off);
  $('ship').textContent = 'ค่าส่ง ' + money(ship);
  $('net').textContent = 'ยอดสุทธิ ' + money(sub - off + ship);
  $('order').disabled = n === 0;
  $('msg').textContent = msg || '';
  save();
}
function change(name, d) { const q = (S.cart[name] || 0) + d;
  if (q > CFG.maxQty) return render('สั่งได้สูงสุด ' + CFG.maxQty + ' ชิ้นต่อรายการ');
  if (q <= 0) delete S.cart[name]; else S.cart[name] = q; render(''); }
function init() {
  document.title = CFG.shop; $('shop').textContent = CFG.shop;
  for (const i of CFG.items) { const li = document.createElement('li'); li.className = 'card';
    const h = document.createElement('h3'); h.textContent = i.name; h.style.margin = '0'; h.style.fontSize = '1rem';
    const p = document.createElement('p'); p.textContent = money(i.price); p.style.margin = '4px 0';
    const b = document.createElement('button'); b.type = 'button'; b.textContent = CFG.add; b.onclick = () => change(i.name, 1);
    li.append(h, p, b); $('items').append(li); }
  $('apply').onclick = () => { const c = $('code').value.trim().toUpperCase();
    if (c === CFG.pct.code) { S.code = c; return render(''); }
    if (c === CFG.fixed.code) { if (subtotal() < CFG.fixed.min) return render(MINMSG); S.code = c; return render(''); }
    render('ไม่พบโค้ดส่วนลด'); };
  $('clear').onclick = () => { S.code = null; $('code').value = ''; render(''); };
  $('order').onclick = () => { S.orders += 1; S.cart = {}; S.code = null; $('code').value = ''; render('สั่งซื้อสำเร็จ เลขที่ออเดอร์ #' + String(S.orders).padStart(4, '0')); };
  load(); render('');
}
init();
</script>
</body>
</html>
