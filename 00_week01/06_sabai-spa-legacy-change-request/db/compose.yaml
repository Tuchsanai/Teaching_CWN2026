name: sabai06-db

services:
  sabai06-db:
    image: postgres:16-alpine
    container_name: sabai06-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sabai
      POSTGRES_PASSWORD: sabai
      POSTGRES_DB: sabai
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - sabai06-pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - sabai06-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabai -d sabai"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sabai06-pgdata:
    name: sabai06-pgdata

networks:
  sabai06-net:
    external: true
