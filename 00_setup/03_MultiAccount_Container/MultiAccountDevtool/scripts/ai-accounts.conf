# /etc/ai-accounts.conf — ค่ากลางของระบบหลายบัญชี (ai-accounts-setup และ wrapper yoloN/cyoloN อ่านไฟล์นี้)
BASE_PATH="$HOME/ai-accounts"   # แก้ที่นี่ที่เดียว (ใน container $HOME=/root → /root/ai-accounts = named volume)

CLAUDE_ACCOUNTS="yolo1 yolo2 yolo3 yolo4 yolo5"
CODEX_ACCOUNTS="cyolo1 cyolo2 cyolo3 cyolo4 cyolo5"

# Chromium ของ Playwright อยู่ใน image (นอก volume) ใช้ร่วมทุกบัญชี
PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}"
# ไฟล์ที่ Playwright MCP บันทึก (screenshot/trace) — อยู่นอกโฟลเดอร์งาน /workspace
PLAYWRIGHT_OUTPUT_DIR="$BASE_PATH/playwright-output"
