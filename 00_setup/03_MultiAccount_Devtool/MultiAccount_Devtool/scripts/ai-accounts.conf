# /etc/ai-accounts/ai-accounts.conf — ค่ากลางของระบบหลายบัญชี (wrapper / init / check อ่านไฟล์นี้)
# BASE_PATH แก้ที่นี่ที่เดียว; ทดสอบชั่วคราวได้ด้วย env AI_ACCOUNTS_BASE=/path
# BASE_PATH เป็น volume (docker run -v ai-accounts:/root/ai-accounts) — credential/config/session อยู่ที่นี่ ไม่อยู่ใน image
BASE_PATH="${AI_ACCOUNTS_BASE:-/root/ai-accounts}"

CLAUDE_ACCOUNTS="yolo1 yolo2 yolo3 yolo4 yolo5"
CODEX_ACCOUNTS="cyolo1 cyolo2 cyolo3 cyolo4 cyolo5"

# Chromium ของ Playwright ติดตั้งใน image (นอก volume) ใช้ร่วมกันทุกบัญชี
PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-/opt/ms-playwright}"
# ภาพ/ไฟล์ที่ Playwright MCP บันทึก — อยู่นอกโฟลเดอร์งาน (/workspace)
PLAYWRIGHT_OUTPUT_DIR="$BASE_PATH/playwright-output"
