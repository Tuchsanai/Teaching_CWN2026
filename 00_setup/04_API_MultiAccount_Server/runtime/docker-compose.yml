# One app container on the outer Docker host. Values come from .env (see .env.example);
# run via scripts/deploy.sh (checks the daemon, port, host folder and syncs logins first).
name: ${COMPOSE_PROJECT_NAME:-ai-chat}

services:
  app:
    build:
      context: .
      target: runtime
    image: ${APP_IMAGE:-ai-chat-app:latest}
    container_name: ${APP_CONTAINER_NAME:-ai-chat-app}
    restart: unless-stopped
    init: false            # tini is the entrypoint
    ports:
      # host side: loopback by default; container side: fixed port the app listens on (0.0.0.0:8004)
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8004}:8004"
    environment:
      LISTEN_PORT: "8004"
      API_TOKEN_FILE: /data/secrets/api_token   # 0400 file in the private volume (see deploy.sh)
      CLAUDE_ACCOUNTS: ${CLAUDE_ACCOUNTS:-yolo1}
      CODEX_ACCOUNTS: ${CODEX_ACCOUNTS:-cyolo1}
      DEFAULT_CLAUDE_ACCOUNT: ${DEFAULT_CLAUDE_ACCOUNT:-yolo1}
      DEFAULT_CODEX_ACCOUNT: ${DEFAULT_CODEX_ACCOUNT:-cyolo1}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-fable}
      DEFAULT_REASONING_EFFORT: ${DEFAULT_REASONING_EFFORT:-medium}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-262144}
      MAX_MESSAGES: ${MAX_MESSAGES:-100}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-32000}
      MAX_TOTAL_CHARS: ${MAX_TOTAL_CHARS:-120000}
      CLI_TIMEOUT_SECONDS: ${CLI_TIMEOUT_SECONDS:-240}
      CLI_MAX_OUTPUT_BYTES: ${CLI_MAX_OUTPUT_BYTES:-4194304}
      MAX_CONCURRENT_CALLS: ${MAX_CONCURRENT_CALLS:-2}
      QUEUE_TIMEOUT_SECONDS: ${QUEUE_TIMEOUT_SECONDS:-30}
    volumes:
      - accounts:/data     # private per-container copy of the account logins
      # index.html lives in its own named volume (not in the image, no bind-mount path needed);
      # deploy.sh fills it from devtools through a pipe and checks the checksum first
      - web:/app/web:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${APP_MEM_LIMIT:-2g}
    cpus: ${APP_CPUS:-2}
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  accounts:
    name: ${ACCOUNTS_VOLUME:-ai-chat-accounts}
    external: true   # created by deploy.sh; never recreated/removed by compose
  web:
    name: ${WEB_VOLUME:-ai-chat-web}
    external: true
