          - paragraph [ref=e5311]: ราคานี้เป็นราคาสุดท้ายซึ่งรวมภาษีและค่าธรรมเนียมทั้งหมดแล้ว โดยคิดรวมค่าธรรมเนียมการชำระเงินสำหรับวิธีการชำระเงินแบบทั่วไปที่ถูกที่สุด (ซึ่งอาจแตกต่างกันตามผู้ให้บริการ) ทั้งนี้ อาจมีการเรียกเก็บเงินเพิ่มเติมสำหรับการชำระเงินประเภทอื่นๆ ค่าสัมภาระ อาหาร WLAN หรือบริการเพิ่มเติมอื่นๆ ระบบจะแสดงรายละเอียดราคา ที่นั่งว่าง และการเดินทางโดยอิงตามข้อมูลล่าสุดที่ได้รับจากพาร์ทเนอร์ ข้อมูลดังกล่าวจะแสดงในผลการค้นหาภายในระยะเวลาไม่เกิน 24 ชั่วโมง และอาจมีเงื่อนไขเพิ่มเติมจากพาร์ทเนอร์ ดังนั้นโปรดตรวจสอบราคาและเงื่อนไขกับผู้ให้บริการก่อนทำการจอง
