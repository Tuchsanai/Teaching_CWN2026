name: sabai-db

services:
  sabai-db:
    image: postgres:16-alpine
    container_name: sabai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sabai
      POSTGRES_PASSWORD: sabai
      POSTGRES_DB: sabai
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      - "5433:5432"
    volumes:
      - sabai-pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - sabai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabai -d sabai"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sabai-pgdata:
    name: sabai-pgdata

networks:
  sabai-net:
    external: true
