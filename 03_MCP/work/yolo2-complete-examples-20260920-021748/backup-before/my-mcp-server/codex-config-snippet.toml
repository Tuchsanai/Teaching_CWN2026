# ตัวอย่างการตั้งค่า MCP server เดียวกันสำหรับ OpenAI Codex CLI
# วางต่อท้าย ~/.codex/config.toml (หรือ $CODEX_HOME/config.toml)
# หมายเหตุ: รอบทดลอง 2026-09-19 ไม่ได้รันกับ Codex (โควตาบัญชีใกล้หมด) — เป็นการตั้งค่าตามรูปแบบเดียวกับ
# [mcp_servers.playwright] / [mcp_servers.excalidraw] ที่ใช้งานจริงบนเครื่องนี้

[mcp_servers.hello-lab]
command = "/opt/venv/bin/python"
args = ["/root/workspace/CWN/Teaching/03_MCP/labs/my-mcp-server/hello_server.py"]

[mcp_servers.kokoro-tts]
command = "/opt/venv/bin/python"
args = ["/root/workspace/CWN/Teaching/03_MCP/labs/my-mcp-server/tts_server.py"]

[mcp_servers.kokoro-tts.env]
KOKORO_DEVICE = "cpu"
