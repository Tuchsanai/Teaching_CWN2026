    - button "ปิดกล่องโต้ตอบ":
      - img
    - text: การปล่อยก๊าซ CO2e 363กก. ปริมาณการปล่อยก๊าซเรือนกระจกตลอดอายุการใช้งาน (ตามที่แสดงไว้เป็น CO2e) เป็นค่าที่คำนวณไว้สำหรับผู้โดยสาร 1 คนในชั้นโดยสารที่เลือก โดยพิจารณาจากปัจจัยหลายอย่าง โอกาสในการทำให้เกิดภาวะโลกร้อนจากคอนเทรล ต่ำ คอนเทรลหรือ "รอยทางที่เกิดจากการควบแน่น" คือกลุ่มเมฆรูปร่างเป็นเส้นที่อยู่ด้านหลังเครื่องบินและมีส่วนทำให้เกิดผลกระทบต่อสภาพอากาศของอุตสาหกรรมการบินถึง 1 ใน 3 จากทั้งหมด ค่าประมาณจาก
