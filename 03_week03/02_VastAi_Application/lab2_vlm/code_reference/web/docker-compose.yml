name: vapp-lab2
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: receipt
      POSTGRES_PASSWORD: receipt
      POSTGRES_DB: receipt
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt"]
      interval: 3s
      retries: 20
  web:
    build: .
    # AI server URL, key and model names: read only by the web server, never sent to the browser
    env_file: ../receipt.env
    environment:
      DATABASE_URL: postgres://receipt:receipt@db:5432/receipt
    ports:
      - "3404:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
