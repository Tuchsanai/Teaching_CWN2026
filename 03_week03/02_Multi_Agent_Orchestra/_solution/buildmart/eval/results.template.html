<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผลประเมิน BuildMart</title>
<style>
:root{--brand:#f26b1d;--brand-2:#ff8a3d;--brand-dark:#ff9a55;--brand-soft:rgba(242,107,29,.12);--brand-line:rgba(242,107,29,.38);--cyan:#3fd6ff;--bg:#10141c;--bg-deep:#0a0d13;--bg-raise:#161c27;--card:rgba(24,30,42,.72);--card-solid:#171d29;--glass:rgba(255,255,255,.035);--glass-2:rgba(255,255,255,.06);--ink:#eef1f6;--ink-2:#b8c0ce;--muted:#8a94a6;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);--ok:#3ddc97;--ok-soft:rgba(61,220,151,.12);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.12);--danger:#ff6b6b;--danger-soft:rgba(255,107,107,.12);--radius:14px;--font:'Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',system-ui,sans-serif;--mono:ui-monospace,'Cascadia Mono',Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,rgba(242,107,29,.10),transparent 60%),var(--bg-deep);color:var(--ink);font:15px/1.6 var(--font)}
header{padding:22px 16px 10px;max-width:1280px;margin:0 auto}
h1{margin:0 0 4px;font-size:22px}h1 b{color:var(--brand-dark)}
.sub{color:var(--muted);font-size:13px}
main{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.toggle{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;margin:10px 0}
.toggle button{background:transparent;color:var(--ink-2);border:0;padding:6px 14px;font:inherit;cursor:pointer}
.toggle button.on{background:var(--brand);color:#fff}
.toggle button:disabled{opacity:.4;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between}
.card h3 span{color:var(--muted);font-weight:400;font-size:12px}
.met{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;border-bottom:1px dashed var(--line)}
.met b{font-family:var(--mono)}
.d{font-size:11px;margin-left:6px}.d.up{color:var(--ok)}.d.dn{color:var(--danger)}
.big{font-size:28px;font-weight:700;color:var(--brand-dark)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg-deep);padding:10px 0;z-index:2;border-bottom:1px solid var(--line)}
input,select{background:var(--bg-raise);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px}
input[type=search]{flex:1;min-width:200px}
.count{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px;border-bottom:1px solid var(--line-2)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover{background:var(--glass-2)}
.id{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--brand-dark)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--glass-2);color:var(--ink-2);margin:1px 2px 1px 0}
.v{font-size:16px;text-align:center}
.detail td{background:var(--bg-raise);padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.hide-m{display:none}}
.box{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word}
.box h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500}
.snip{font-size:13px;color:var(--ink-2);border-left:3px solid var(--line-2);padding:4px 8px;margin:6px 0}
.snip.hit{border-left-color:var(--ok)}
.snip b{color:var(--ink)}
.reason{color:var(--warn)}
.turn{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.turn .h{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.mtx{font-family:var(--mono);font-size:12px;color:var(--muted)}
.met small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.met span{cursor:help}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin:0 0 12px}
details.sec>summary{cursor:pointer;font-weight:600}
details.sec a{color:var(--cyan);font-weight:400;font-size:13px;margin-left:8px}
.ex{margin:12px 0}.ex h4{margin:0 0 2px;font-size:14px;color:var(--brand-dark)}.ex .sub{margin-bottom:4px}
.ex table{font-size:12.5px;margin-top:4px}.ex td{padding:5px}
.scroll{overflow-x:auto}
th[title]{cursor:help;text-decoration:underline dotted}
</style>
</head>
<body>
<header>
  <h1>ผลประเมิน <b>บ้านช่าง BuildMart</b> — RAG · คำถามร้าน · บทสนทนา</h1>
  <div class="sub" id="cfg"></div>
  <div class="toggle" role="tablist"><button id="t-on" class="on">rerank on</button><button id="t-off">rerank off</button></div>
</header>
<main>
  <section class="cards" id="cards"></section>
  <details class="sec" id="sec-metrics"><summary>ตัวชี้วัดคืออะไร · เกณฑ์ผ่าน <a href="METRICS.md" target="_blank" rel="noopener">อ่านละเอียดใน METRICS.md ↗</a></summary><div id="metrics"></div></details>
  <details class="sec" id="sec-ex"><summary>ตัวอย่างจริงต่อตัวชี้วัด (12 ตัว · จากรอบนี้)</summary><div id="examples"></div></details>
  <div class="filters">
    <input type="search" id="q" placeholder="ค้นหา id / คำถาม / คำตอบ / เหตุผล…">
    <select id="f-set"><option value="">ทุก set</option><option>rag</option><option>qa</option><option>conv</option></select>
    <select id="f-doc"><option value="">ทุกเอกสาร</option></select>
    <select id="f-type"><option value="">ทุกประเภท</option></select>
    <select id="f-pass"><option value="">ทุกผล</option><option value="fail">ไม่ผ่าน (❌+⚠️)</option><option value="❌">❌ ผิด</option><option value="⚠️">⚠️ บางส่วน</option><option value="✅">✅ ผ่าน</option></select>
    <span class="count" id="count"></span>
  </div>
  <table>
    <thead><tr><th>id</th><th>คำถาม</th><th class="hide-m">คำตอบจาก AI</th><th class="hide-m" title="Hit@4: ใน 4 ย่อหน้าที่ค้นได้ มีหน้าที่มีคำตอบไหม (หน้าที่ถูก = เส้นเขียวในรายละเอียด)">หน้าที่ค้นได้ / ที่ถูก</th><th id="th-pass">ผล</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
</main>
<script>
const DATA = /*__DATA__*/null;
let cur = 'on';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const pct = (v) => (v == null ? '–' : (v * 100).toFixed(1) + '%');
const short = (f) => String(f || '').replace(/^BM-(DS-)?/, '').replace(/\.pdf$/, '');
const pg = (a) => (a || []).map((r) => short(r.filename || r.f) + ' p' + (r.page ?? r.p)).join(', ') || '–';
const trim = (s, n) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const NAMES = { hit_at_4: 'hit@4', mrr: 'MRR', citation_acc: 'citation', faithfulness: 'faithfulness', correctness: 'correctness', key_fact_recall: 'key-fact recall', exact_value: 'exact value', sql_correct: 'SQL/สินค้าถูก', context_retention: 'context retention', state_ok: 'สถานะตะกร้า', stt_cer: 'STT CER ↓' };
const CARD = { rag: ['hit_at_4', 'mrr', 'citation_acc', 'faithfulness', 'correctness'], qa: ['exact_value', 'sql_correct', 'correctness'], conv: ['correctness', 'context_retention', 'state_ok', 'stt_cer'] };
const TITLE = { rag: 'A · RAG จาก PDF', qa: 'B · คำถามร้าน (DB)', conv: 'C · บทสนทนาหลายรอบ' };
if (!DATA.off) $('#t-off').disabled = true;

function cards() {
  const R = DATA[cur], O = DATA[cur === 'on' ? 'off' : 'on'];
  $('#cfg').textContent = Object.entries(R.config || {}).map(([k, v]) => k + '=' + (typeof v === 'object' ? JSON.stringify(v) : v)).join(' · ') + ' · สร้าง ' + DATA.generated.slice(0, 16).replace('T', ' ');
  let h = '';
  for (const set of ['rag', 'qa', 'conv']) {
    const s = R.summary?.[set];
    if (!s) { h += `<div class="card"><h3>${TITLE[set]}</h3><div class="sub">ไม่ได้รัน set นี้ในโหมดนี้</div></div>`; continue; }
    const o = O?.summary?.[set];
    const I = DATA.info;
    h += `<div class="card"><h3>${TITLE[set]} <span>n=${s.n}${s.turns ? ' · ' + s.turns + ' รอบ' : ''} · ตัดสิน ${s.judged}</span></h3><div class="big" title="${esc(I.pass[1])}">${pct(s.pass_m)}</div><div class="sub" title="${esc(I.pass[1])}">ผ่าน (เกณฑ์ METRICS = dashboard) · ผ่านเต็ม ${pct(s.pass_strict)}</div>`;
    for (const k of CARD[set]) {
      if (s[k] == null) continue;
      let d = '';
      if (o && o[k] != null) { const x = (s[k] - o[k]) * 100; const good = k === 'stt_cer' ? x < 0 : x > 0; d = Math.abs(x) < 0.05 ? '' : `<span class="d ${good ? 'up' : 'dn'}">${x > 0 ? '+' : ''}${k === 'stt_cer' ? (s[k] - o[k]).toFixed(3) : x.toFixed(1) + 'pt'} vs ${cur === 'on' ? 'off' : 'on'}</span>`; }
      const inf = I[k] || [k, '', ''];
      h += `<div class="met" title="${esc(inf[1])} · ค่าที่ดี ${esc(inf[2])}"><span>${esc(inf[0])}<small>${esc(inf[1])} · ดี ${esc(inf[2])}</small></span><b>${k === 'stt_cer' ? s[k].toFixed(3) : pct(s[k])}${d}</b></div>`;
    }
    h += '</div>';
  }
  $('#cards').innerHTML = h;
  const its = R.items;
  const fill = (sel, vals, label) => { const v = $(sel).value; $(sel).innerHTML = `<option value="">${label}</option>` + vals.map((x) => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join(''); };
  fill('#f-doc', [...new Set(its.map((i) => i.doc).filter(Boolean))].sort(), 'ทุกเอกสาร');
  fill('#f-type', [...new Set(its.map((i) => i.qtype).filter(Boolean))].sort(), 'ทุกประเภท');
}

function srcHit(r, src) { return (src || []).some((s) => s.filename === r.f && s.page === r.p); }
function snips(ret, src) { return (ret || []).map((r, i) => `<div class="snip ${srcHit(r, src) ? 'hit' : ''}"><b>${i + 1}. ${esc(short(r.f))} p${r.p}</b> <span class="mtx">score ${r.s ?? '–'}${srcHit(r, src) ? ' · ตรงหน้าที่ถูก' : ''}</span><br>${esc(r.t || '(ไม่มีข้อความหน้า)')}</div>`).join('') || '<div class="sub">ไม่มี</div>'; }
const mtx = (m) => Object.entries(m || {}).map(([k, v]) => (NAMES[k] || k) + '=' + (typeof v === 'number' ? +v.toFixed(3) : v)).join(' · ');
const ic = (v) => (v == null ? '–' : v === 1 ? '✅' : v === 0.5 ? '⚠️' : '❌');

function detail(it) {
  if (it.set === 'conv') {
    return `<div class="sub">${esc(it.title || '')} · ${mtx(it.m)}</div>${it.reason ? `<div class="reason">${esc(it.reason)}</div>` : ''}` + it.turns.map((t) => `<div class="turn"><div class="h"><b>รอบ ${t.n}</b> correctness ${ic(t.m?.correctness)} ${t.n > 1 ? '· retention ' + ic(t.m?.context_retention) : ''} ${t.cart != null ? '· ตะกร้า ' + t.cart : ''} ${t.quote ? '· ใบเสนอราคา ' + esc(t.quote) : ''} <span class="mtx">${mtx(t.m)}</span></div>
      <div class="grid2"><div class="box"><h4>คำถาม${t.audio ? ' 🎤 ' + esc(t.audio) : ''}</h4>${esc(t.q)}${t.audio ? '\n\nถอดเสียงได้: “' + esc(t.tr ?? '(ไม่มี)') + '”' : ''}${t.ref ? '\n\nอ้างถึง: ' + esc(t.ref) : ''}\n\nคาด: ${esc(t.exp)}</div><div class="box"><h4>คำตอบจาก AI</h4>${esc(t.a)}</div></div>
      ${t.reason ? `<div class="reason">${esc(t.reason)}</div>` : ''}${t.ret?.length ? '<details><summary class="sub">ย่อหน้าที่ค้นได้ (' + pg(t.ret) + ')</summary>' + snips(t.ret, t.src) + '</details>' : ''}</div>`).join('');
  }
  const exp = esc(it.exp) + (it.vals?.length ? '\n\nค่าที่ต้องมี: ' + esc(it.vals.map((v) => (Array.isArray(v) ? v.join(' / ') : v)).join(', ')) : '') + (it.kf?.length ? '\n\nkey facts: ' + esc(it.kf.map((v) => (Array.isArray(v) ? v.join(' / ') : v)).join(' · ')) : '');
  return `<div class="grid2"><div class="box"><h4>คำตอบที่คาด</h4>${exp}${it.src?.length ? '\n\nหน้าที่ถูก: ' + pg(it.src) : ''}</div><div class="box"><h4>คำตอบจาก AI (เต็ม)</h4>${esc(it.a)}${it.cites?.length ? '\n\nอ้างอิง: ' + pg(it.cites) : ''}${it.products?.length ? '\nสินค้าที่ดึงจาก DB: ' + esc(it.products.join(', ')) : ''}</div></div>
  <div class="mtx" style="margin:8px 0">${mtx(it.m)}</div>${it.reason ? `<div class="reason">เหตุผล: ${esc(it.reason)}</div>` : ''}
  <h4 class="sub" style="margin:10px 0 0">ย่อหน้าที่ค้นได้ (top 4 · เส้นเขียว = หน้าที่ถูก)</h4>${snips(it.ret, it.src)}`;
}

function render() {
  const R = DATA[cur];
  const q = $('#q').value.trim().toLowerCase(), fs = $('#f-set').value, fd = $('#f-doc').value, ft = $('#f-type').value, fp = $('#f-pass').value;
  const rank = { '❌': 0, '⚠️': 1, '✅': 2 };
  const its = R.items.filter((i) => (!fs || i.set === fs) && (!fd || i.doc === fd) && (!ft || i.qtype === ft) && (!fp || (fp === 'fail' ? i.v !== '✅' : i.v === fp)) &&
    (!q || [i.id, i.q, i.a, i.reason, i.exp, i.title].join(' ').toLowerCase().includes(q))).sort((a, b) => a.set.localeCompare(b.set) || rank[a.v] - rank[b.v] || a.id.localeCompare(b.id));
  $('#count').textContent = `${its.length} / ${R.items.length} ข้อ · ผ่าน ${its.filter((i) => i.pass).length}`;
  $('#tb').innerHTML = its.map((it, k) => {
    const pages = it.set === 'rag' ? `${pg(it.ret)}<br><span class="sub">ถูก: ${pg(it.src)}</span>` : it.set === 'conv' ? `${it.turns.length} รอบ${it.qtype === 'voice' ? ' · 🎤' : ''}` : `<span class="sub">DB: ${esc((it.products || []).slice(0, 3).join(', ') || '–')}</span>`;
    return `<tr class="row" data-k="${k}"><td class="id">${esc(it.id)}<br><span class="tag">${it.set}</span><span class="tag">${esc(it.qtype || '')}</span></td><td>${esc(trim(it.set === 'conv' ? (it.title || it.q) : it.q, 160))}</td><td class="hide-m">${esc(trim(it.a, 180))}</td><td class="hide-m" style="font-size:12px">${pages}</td><td class="v">${it.v}</td></tr><tr class="detail" hidden><td colspan="5"></td></tr>`;
  }).join('');
  $('#tb').onclick = (e) => {
    const tr = e.target.closest('tr.row'); if (!tr) return;
    const d = tr.nextElementSibling; const it = its[+tr.dataset.k];
    if (d.hidden) { d.firstElementChild.innerHTML = detail(it); d.hidden = false; } else d.hidden = true;
  };
}
const bold = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const tableH = (head, rows) => `<div class="scroll"><table><thead><tr>${head.map((x) => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${bold(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function statics() {
  $('#metrics').innerHTML = tableH(['#', 'ตัวชี้วัด', 'วัดอะไร', 'ใครตรวจ', 'ค่าที่ดี'], DATA.metrics.map((m) => [m.n, m.name, m.what, m.who, m.good])) +
    `<p class="sub"><b>ผ่าน/ไม่ผ่าน ต่อข้อ</b> (ตาม METRICS.md): ${esc(DATA.info.pass[1])} · ✅ ผ่านและได้เต็ม · ⚠️ ผ่านแต่ยังไม่เต็ม · ❌ ไม่ผ่าน · "ผ่านเต็ม (dashboard)" = ${esc(DATA.info.strict[1])}</p>`;
  $('#examples').innerHTML = '<p class="sub">ตัวอย่างจากรอบ rerank on (ยกเว้นที่ระบุ run) · ตัวหนา = หน้าที่ถูก/คะแนน</p>' + DATA.examples.map((e) => `<div class="ex"><h4>${esc(e.n)}) ${esc(e.name)}</h4><div class="sub">${esc(e.what)}${e.note ? ' · ' + esc(e.note) : ''}</div>${tableH(e.head, e.rows)}${e.extra ? `<div class="sub" style="margin-top:6px"><b>${esc(e.extra.title)}</b></div>${tableH(e.extra.head, e.extra.rows)}` : ''}</div>`).join('');
  $('#th-pass').title = 'ผ่าน/ไม่ผ่าน: ' + DATA.info.pass[1] + ' · ✅ เต็ม · ⚠️ ผ่านแต่ไม่เต็ม · ❌ ไม่ผ่าน';
}
statics();
function sw(m) { cur = m; $('#t-on').classList.toggle('on', m === 'on'); $('#t-off').classList.toggle('on', m === 'off'); cards(); render(); }
$('#t-on').onclick = () => sw('on'); $('#t-off').onclick = () => DATA.off && sw('off');
for (const s of ['#q', '#f-set', '#f-doc', '#f-type', '#f-pass']) $(s).addEventListener('input', render);
sw('on');
</script>
</body>
</html>
