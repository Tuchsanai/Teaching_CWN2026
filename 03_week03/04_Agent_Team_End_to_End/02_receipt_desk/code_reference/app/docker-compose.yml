x-web-runtime: &web-runtime
  image: receiptdesk-web:local
  build:
    context: ./web
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

x-web-environment: &web-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://receiptdesk:${POSTGRES_PASSWORD:-receiptdesk_dev}@db:5432/receiptdesk}
  UPLOAD_DIR: /app/uploads
  BUG_MODE: ${BUG_MODE:-0}
  TZ: Asia/Bangkok

services:
  web:
    <<: *web-runtime
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      <<: *web-environment
      SESSION_SECRET: ${SESSION_SECRET:-}
      ENABLE_TEST_RESET: ${ENABLE_TEST_RESET:-0}
      TEST_RESET_TOKEN: ${TEST_RESET_TOKEN:-}
      AI_MODE: ${AI_MODE:-gateway}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  dispatcher:
    <<: *web-runtime
    command: [npm, run, dispatcher]
    environment:
      <<: *web-environment
      AI_MODE: ${AI_MODE:-gateway}
      GATEWAY_URL: ${GATEWAY_URL:-}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      GATEWAY_CA_CERT: ${GATEWAY_CA_CERT:-}
    volumes:
      - uploads:/app/uploads:ro

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: receiptdesk
      POSTGRES_USER: receiptdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-receiptdesk_dev}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./web/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
