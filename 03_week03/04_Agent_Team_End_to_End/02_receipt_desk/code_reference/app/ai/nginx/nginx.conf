# ReceiptDesk NGINX in front of vLLM 0 (GPU 0) and vLLM 1 (GPU 1).
# Generated by: python -m ai.worker.worker --nginx-conf
# Workers call http://127.0.0.1:8080/v1/chat/completions and never a vLLM port directly.
worker_processes auto;
events { worker_connections 1024; }

http {
    access_log off;            # NFR-07: request bodies hold receipt images; keep no log of them
    error_log /dev/stderr warn;

    upstream vllm {
        least_conn;            # the less busy GPU gets the next receipt
        server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;       # internal only (DESIGN 1.2): not published outside the GPU machine
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        client_max_body_size 32m;              # 10 MB receipt as base64 PNG + prompt
        client_body_buffer_size 32m;           # keep images in memory, not in temp files

        location / {
            proxy_pass http://vllm;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;  # DESIGN 6.3: 60 s per read
            # vLLM down or hung -> try the other one (completions are stateless, so POST is safe)
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 60s;
        }
    }
}
