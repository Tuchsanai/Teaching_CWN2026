<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1510" viewBox="0 0 1400 1510"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#697078" stroke-width="1.4"/></marker></defs><rect width="1400" height="1510" fill="white"/><style>text{font-family:'Noto Sans Thai',Tahoma,sans-serif;fill:#35434c}</style><text x="700" y="48" text-anchor="middle" font-size="30">Dynamic Workflow · โครงสร้างตาม Template 3.2</text><rect x="425" y="85" width="550" height="80" rx="15" fill="#f1eee8" stroke="#88817b" stroke-width="1.5"/><text x="700.0" y="117.0" text-anchor="middle" font-size="22">INPUT · โจทย์และเป้าหมาย</text><text x="700.0" y="149.0" text-anchor="middle" font-size="22">NEW INFORMATION · รอบแรก NONE</text><path d="M700 165 V200" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="200" width="550" height="100" rx="15" fill="#efebfa" stroke="#8a7eb0" stroke-width="1.5"/><text x="700.0" y="242.0" text-anchor="middle" font-size="22">PLANNER · ผู้วางแผน</text><text x="700.0" y="274.0" text-anchor="middle" font-size="22">สร้าง Plan v1: งาน / Dependency / สถานะ</text><path d="M700 300 V350" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="350" width="550" height="115" rx="15" fill="#e3f3ed" stroke="#699b87" stroke-width="1.5"/><text x="700.0" y="383.5" text-anchor="middle" font-size="22">EXECUTOR · ผู้ลงมือทำ</text><text x="700.0" y="415.5" text-anchor="middle" font-size="22">เลือกงาน TODO ที่ Dependency ทุกตัว DONE</text><text x="700.0" y="447.5" text-anchor="middle" font-size="22">ทำทีละงานและบันทึกผลลัพธ์</text><path d="M700 465 V505" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="505" width="550" height="100" rx="15" fill="#fff2da" stroke="#c29c5f" stroke-width="1.5"/><text x="700.0" y="547.0" text-anchor="middle" font-size="22">EVALUATOR · ผู้ประเมิน</text><text x="700.0" y="579.0" text-anchor="middle" font-size="22">ตรวจผล: แผนยังเหมาะสมหรือไม่?</text><path d="M700 605 V675" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="647" text-anchor="middle" font-size="20">ใช่</text><rect x="425" y="675" width="550" height="100" rx="15" fill="#fff2da" stroke="#c29c5f" stroke-width="1.5"/><text x="700.0" y="717.0" text-anchor="middle" font-size="22">ทุกงาน DONE / DROPPED</text><text x="700.0" y="749.0" text-anchor="middle" font-size="22">และผู้ประเมินยืนยันว่าบรรลุเป้าหมาย?</text><path d="M700 775 V835" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="809" text-anchor="middle" font-size="20">ใช่</text><rect x="425" y="835" width="550" height="100" rx="15" fill="#e3f3ed" stroke="#699b87" stroke-width="1.5"/><text x="700.0" y="877.0" text-anchor="middle" font-size="22">จบ · ส่งมอบผลงานสุดท้าย</text><text x="700.0" y="909.0" text-anchor="middle" font-size="22">บันทึกเวอร์ชันแผน + บันทึกการทำงาน</text><path d="M975 725 H1010 V408 H975" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><text x="1150" y="700" text-anchor="middle" font-size="20">ยังไม่ครบ</text><text x="1150" y="732" text-anchor="middle" font-size="20">ทำงานถัดไป</text><path d="M425 555 H390 V135 H210 V175" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><text x="325" y="530" text-anchor="middle" font-size="20">ไม่ใช่</text><rect x="40" y="175" width="325" height="125" rx="15" fill="#fff2da" stroke="#c29c5f" stroke-width="1.5"/><text x="202.5" y="213.5" text-anchor="middle" font-size="22">ตรวจเหตุให้ปรับแผน</text><text x="202.5" y="245.5" text-anchor="middle" font-size="22">พบงานที่ขาด / งานทำไม่ได้</text><text x="202.5" y="277.5" text-anchor="middle" font-size="22">หรือข้อกำหนดเปลี่ยน</text><path d="M210 300 V350" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="350" width="285" height="100" rx="15" fill="#fff2da" stroke="#c29c5f" stroke-width="1.5"/><text x="182.5" y="392.0" text-anchor="middle" font-size="22">ตรวจขีดจำกัด</text><text x="182.5" y="424.0" text-anchor="middle" font-size="22">Re-plan สูงสุด 3 ครั้ง</text><path d="M180 450 V575" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><text x="175" y="495" text-anchor="middle" font-size="18">ยังไม่ถึงขีดจำกัด</text><rect x="40" y="575" width="285" height="125" rx="15" fill="#efebfa" stroke="#8a7eb0" stroke-width="1.5"/><text x="182.5" y="613.5" text-anchor="middle" font-size="22">PLANNER · ปรับแผน</text><text x="182.5" y="645.5" text-anchor="middle" font-size="22">สร้างเวอร์ชันถัดไป vN</text><text x="182.5" y="677.5" text-anchor="middle" font-size="22">พร้อมเหตุผลและผลกระทบ</text><path d="M325 630 H365 V325 H700 V350" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="744" text-anchor="middle" font-size="18">ใช้แผนใหม่เลือกงานถัดไป</text><path d="M40 400 H20 V835 H40" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><text x="165" y="805" text-anchor="middle" font-size="18">ถึงขีดจำกัด</text><rect x="40" y="835" width="285" height="100" rx="15" fill="#f9efef" stroke="#cba2a2" stroke-width="1.5"/><text x="182.5" y="877.0" text-anchor="middle" font-size="22">หยุดและรายงาน</text><text x="182.5" y="909.0" text-anchor="middle" font-size="22">สิ่งที่ยังตัดสินใจไม่ได้</text><rect x="1030" y="175" width="330" height="125" rx="15" fill="#f1eee8" stroke="#88817b" stroke-width="1.5"/><text x="1195.0" y="213.5" text-anchor="middle" font-size="22">NEW INFORMATION</text><text x="1195.0" y="245.5" text-anchor="middle" font-size="22">ข้อมูลใหม่ / Change Request</text><text x="1195.0" y="277.5" text-anchor="middle" font-size="22">ให้ผู้ประเมินพิจารณาผลกระทบ</text><path d="M1195 300 V555 H975" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="700" y="1030" text-anchor="middle" font-size="25">กติกาที่กำกับการปรับแผนทุกครั้ง</text><rect x="45" y="1060" width="640" height="140" rx="15" fill="#f7f9fb" stroke="#ccd4dc" stroke-width="1.5"/><text x="365.0" y="1106.0" text-anchor="middle" font-size="22">เหตุผล · ระบุ Trigger ที่เกิดขึ้น</text><text x="365.0" y="1138.0" text-anchor="middle" font-size="22">สิ่งที่เปลี่ยน · เพิ่ม / ตัด / แยก / รวม / จัดลำดับ</text><text x="365.0" y="1170.0" text-anchor="middle" font-size="22">หรือเปลี่ยน Dependency ของงาน</text><rect x="715" y="1060" width="640" height="140" rx="15" fill="#f7f9fb" stroke="#ccd4dc" stroke-width="1.5"/><text x="1035.0" y="1106.0" text-anchor="middle" font-size="22">Impact analysis · วิเคราะห์งานและผลที่ได้รับผลกระทบ</text><text x="1035.0" y="1138.0" text-anchor="middle" font-size="22">Reuse · เก็บผลงาน DONE ที่ยังใช้ได้</text><text x="1035.0" y="1170.0" text-anchor="middle" font-size="22">ห้ามทำ DONE ซ้ำ ถ้าไม่มีผลกระทบรองรับ</text><rect x="45" y="1225" width="640" height="115" rx="15" fill="#fff5e7" stroke="#d5bc91" stroke-width="1.5"/><text x="365.0" y="1258.5" text-anchor="middle" font-size="22">ห้ามตัดข้อกำหนดโดยไม่แจ้ง</text><text x="365.0" y="1290.5" text-anchor="middle" font-size="22">งาน DROPPED ต้องมีเหตุผล</text><text x="365.0" y="1322.5" text-anchor="middle" font-size="22">แผนแรกยังเหมาะสม → ใช้ต่อได้ ไม่ต้องเปลี่ยนเวอร์ชัน</text><rect x="715" y="1225" width="640" height="115" rx="15" fill="#f7f9fb" stroke="#ccd4dc" stroke-width="1.5"/><text x="1035.0" y="1258.5" text-anchor="middle" font-size="22">สถานะงาน: TODO / DONE / DROPPED</text><text x="1035.0" y="1290.5" text-anchor="middle" font-size="22">บันทึกการทำงาน: ขั้นตอน / งาน / ผลลัพธ์</text><text x="1035.0" y="1322.5" text-anchor="middle" font-size="22">และการตัดสินของ EVALUATOR</text><text x="700" y="1400" text-anchor="middle" font-size="21">อ่านภาพคู่กับหัวข้อ 3.2: WORKFLOW → RE-PLAN TRIGGERS → RULES → STOP CONDITION</text><text x="700" y="1440" text-anchor="middle" font-size="20">เส้นประแสดงข้อมูลใหม่ที่ส่งให้ผู้ประเมินพิจารณา</text></svg>