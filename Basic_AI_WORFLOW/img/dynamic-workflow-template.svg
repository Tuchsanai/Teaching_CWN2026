<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1510" viewBox="0 0 1400 1510"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526577" stroke="#526577" stroke-width="1"/></marker></defs><rect width="1400" height="1510" fill="white"/><style>text{font-family:'Noto Sans Thai',Tahoma,sans-serif;fill:#35434c}</style><text x="700" y="48" text-anchor="middle" font-size="30">Dynamic Workflow · ตาม Template 3.2</text><text x="420" y="100" text-anchor="middle" font-size="25">01  ทำงานและตรวจผล</text><text x="1100" y="100" text-anchor="middle" font-size="25">02  ปรับแผนเฉพาะเมื่อจำเป็น</text><rect x="140" y="130" width="560" height="90" rx="15" fill="#f1eee8" stroke="#88817b" stroke-width="1.5"/><text x="420.0" y="167.0" text-anchor="middle" font-size="22">INPUT · โจทย์และเป้าหมาย</text><text x="420.0" y="199.0" text-anchor="middle" font-size="22">NEW INFORMATION · NONE หรือข้อมูลใหม่</text><defs><marker id="a7" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#267c78"/></marker></defs><path d="M420 220 V255" fill="none" stroke="#267c78" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a7)"/><rect x="140" y="255" width="560" height="85" rx="15" fill="#efebfa" stroke="#8a7eb0" stroke-width="1.5"/><text x="420.0" y="289.5" text-anchor="middle" font-size="22">PLANNER · ผู้วางแผน</text><text x="420.0" y="321.5" text-anchor="middle" font-size="22">สร้าง Plan v1 พร้อมงาน / Dependency / สถานะ</text><defs><marker id="a11" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#267c78"/></marker></defs><path d="M420 340 V390" fill="none" stroke="#267c78" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a11)"/><rect x="140" y="390" width="560" height="115" rx="15" fill="#e3f3ed" stroke="#699b87" stroke-width="1.5"/><text x="420.0" y="423.5" text-anchor="middle" font-size="22">EXECUTOR · ผู้ลงมือทำ</text><text x="420.0" y="455.5" text-anchor="middle" font-size="22">ทำงาน TODO ทีละงาน เมื่อ Dependency ทุกตัว DONE</text><text x="420.0" y="487.5" text-anchor="middle" font-size="22">บันทึกผลลัพธ์ของงาน</text><defs><marker id="a16" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#267c78"/></marker></defs><path d="M420 505 V550" fill="none" stroke="#267c78" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a16)"/><rect x="140" y="550" width="560" height="100" rx="15" fill="#fff2da" stroke="#c29c5f" stroke-width="1.5"/><text x="420.0" y="592.0" text-anchor="middle" font-size="22">EVALUATOR · ผู้ประเมิน</text><text x="420.0" y="624.0" text-anchor="middle" font-size="22">ตรวจผลและข้อมูลใหม่: แผนยังเหมาะสมหรือไม่?</text><defs><marker id="a20" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#267c78"/></marker></defs><path d="M420 650 V725" fill="none" stroke="#267c78" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a20)"/><text x="450" y="692" text-anchor="middle" font-size="20">ใช่</text><rect x="140" y="725" width="560" height="100" rx="15" fill="#fff2da" stroke="#c29c5f" stroke-width="1.5"/><text x="420.0" y="767.0" text-anchor="middle" font-size="22">ทุกงาน DONE / DROPPED</text><text x="420.0" y="799.0" text-anchor="middle" font-size="22">และยืนยันว่าบรรลุเป้าหมายแล้ว?</text><defs><marker id="a25" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#267c78"/></marker></defs><path d="M140 775 H60 V447 H140" fill="none" stroke="#267c78" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a25)"/><text x="155" y="535" text-anchor="middle" font-size="17">ยังไม่ครบ: ทำงานถัดไป</text><defs><marker id="a27" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#267c78"/></marker></defs><path d="M420 825 V920" fill="none" stroke="#267c78" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a27)"/><text x="455" y="877" text-anchor="middle" font-size="20">ใช่</text><rect x="140" y="920" width="560" height="100" rx="15" fill="#e3f3ed" stroke="#699b87" stroke-width="1.5"/><text x="420.0" y="962.0" text-anchor="middle" font-size="22">จบ · ส่งมอบผลงาน</text><text x="420.0" y="994.0" text-anchor="middle" font-size="22">พร้อมบันทึกเวอร์ชันแผนและบันทึกการทำงาน</text><defs><marker id="a32" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b96a27"/></marker></defs><path d="M700 600 H900" fill="none" stroke="#b96a27" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a32)"/><text x="795" y="580" text-anchor="middle" font-size="20">ไม่ใช่</text><rect x="900" y="535" width="430" height="130" rx="15" fill="#fff2da" stroke="#c29c5f" stroke-width="1.5"/><text x="1115.0" y="576.0" text-anchor="middle" font-size="22">ตรวจเหตุให้ปรับแผน</text><text x="1115.0" y="608.0" text-anchor="middle" font-size="22">พบงานที่ขาด / งานทำไม่ได้</text><text x="1115.0" y="640.0" text-anchor="middle" font-size="22">หรือข้อกำหนดเปลี่ยน</text><defs><marker id="a38" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b96a27"/></marker></defs><path d="M1115 665 V715" fill="none" stroke="#b96a27" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a38)"/><rect x="900" y="715" width="430" height="85" rx="15" fill="#fff2da" stroke="#c29c5f" stroke-width="1.5"/><text x="1115.0" y="749.5" text-anchor="middle" font-size="22">ตรวจขีดจำกัด</text><text x="1115.0" y="781.5" text-anchor="middle" font-size="22">Re-plan ได้สูงสุด 3 ครั้ง</text><defs><marker id="a42" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b96a27"/></marker></defs><path d="M1330 757 H1370 V315 H1330" fill="none" stroke="#b96a27" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a42)"/><text x="1130" y="440" text-anchor="middle" font-size="20">ยังปรับแผนได้</text><text x="1130" y="472" text-anchor="middle" font-size="20">กลับไปสร้างแผนเวอร์ชันใหม่</text><rect x="900" y="245" width="430" height="140" rx="15" fill="#efebfa" stroke="#8a7eb0" stroke-width="1.5"/><text x="1115.0" y="291.0" text-anchor="middle" font-size="22">PLANNER · ปรับแผนเวอร์ชันถัดไป</text><text x="1115.0" y="323.0" text-anchor="middle" font-size="22">ระบุเหตุผล / สิ่งที่เปลี่ยน</text><text x="1115.0" y="355.0" text-anchor="middle" font-size="22">ผลกระทบ / ผลงานเดิมที่ใช้ต่อ</text><defs><marker id="a49" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b96a27"/></marker></defs><path d="M900 315 H800 V447 H700" fill="none" stroke="#b96a27" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a49)"/><text x="795" y="365" text-anchor="middle" font-size="18">ใช้แผนใหม่</text><defs><marker id="a51" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b96a27"/></marker></defs><path d="M1115 800 V920" fill="none" stroke="#b96a27" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a51)"/><text x="1120" y="870" text-anchor="middle" font-size="20">ถึงขีดจำกัด</text><rect x="900" y="920" width="430" height="100" rx="15" fill="#f9efef" stroke="#cba2a2" stroke-width="1.5"/><text x="1115.0" y="962.0" text-anchor="middle" font-size="22">หยุด · รายงาน</text><text x="1115.0" y="994.0" text-anchor="middle" font-size="22">สิ่งที่ยังตัดสินใจไม่ได้</text><text x="700" y="1090" text-anchor="middle" font-size="25">กติกาประกอบ · ใช้ทุกครั้งที่ปรับแผน</text><rect x="45" y="1130" width="640" height="135" rx="15" fill="#f7f9fb" stroke="#ccd4dc" stroke-width="1.5"/><text x="365.0" y="1173.5" text-anchor="middle" font-size="22">เปลี่ยนแผนได้: เพิ่ม / ตัด / แยก / รวม / จัดลำดับงาน</text><text x="365.0" y="1205.5" text-anchor="middle" font-size="22">หรือเปลี่ยน Dependency (งานที่ต้องรอให้เสร็จก่อน)</text><text x="365.0" y="1237.5" text-anchor="middle" font-size="22">งานที่ตัดออกต้องระบุเหตุผล ห้ามตัดข้อกำหนดโดยไม่แจ้ง</text><rect x="715" y="1130" width="640" height="135" rx="15" fill="#f7f9fb" stroke="#ccd4dc" stroke-width="1.5"/><text x="1035.0" y="1173.5" text-anchor="middle" font-size="22">Impact analysis · ระบุงานและผลงานที่ได้รับผลกระทบ</text><text x="1035.0" y="1205.5" text-anchor="middle" font-size="22">Reuse · เก็บผลงาน DONE ที่ยังใช้ได้</text><text x="1035.0" y="1237.5" text-anchor="middle" font-size="22">ห้ามทำ DONE ซ้ำ ถ้าไม่มีผลกระทบรองรับ</text><rect x="45" y="1290" width="1310" height="110" rx="15" fill="#f7f9fb" stroke="#ccd4dc" stroke-width="1.5"/><text x="700.0" y="1321.0" text-anchor="middle" font-size="22">สถานะงาน: TODO (รอทำ) / DONE (เสร็จแล้ว) / DROPPED (ตัดออกพร้อมเหตุผล)</text><text x="700.0" y="1353.0" text-anchor="middle" font-size="22">แผนแรกยังเหมาะสม → ใช้แผนเดิมต่อได้ ไม่จำเป็นต้องเปลี่ยนเวอร์ชัน</text><text x="700.0" y="1385.0" text-anchor="middle" font-size="22">บันทึกการทำงาน: ขั้นตอน / งาน / ผลลัพธ์ / การตัดสินของ EVALUATOR</text><text x="700" y="1460" text-anchor="middle" font-size="22">อ่านทางเดินหลักจากบนลงล่าง · ไปด้านขวาเฉพาะเมื่อจำเป็นต้องปรับแผน</text></svg>