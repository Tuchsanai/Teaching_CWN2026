<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="Loma, 'Noto Sans Thai', 'Sarabun', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Generator–Critic loop พร้อมเงื่อนไขหยุดทั้งหมด</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="540" fill="#FFFFFF"/>

<rect x="190" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="290" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">โจทย์ REQUIREMENT</text>
<text x="290" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">พร้อมเกณฑ์ C1–C3</text>
<line x1="290" y1="96" x2="290" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="140" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="290" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">Generator</text>
<text x="290" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">สร้าง / แก้เฉพาะข้อที่ FAIL</text>
<line x1="290" y1="196" x2="290" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="240" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="290" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Critic</text>
<text x="290" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ให้ PASS/FAIL + หลักฐาน</text>
<line x1="290" y1="296" x2="290" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="340" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="290" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">ผ่านครบทุกเกณฑ์?</text>
<text x="290" y="376" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">PASS ทุกข้อในรอบเดียวกัน</text>
<line x1="290" y1="396" x2="290" y2="428" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300" y="412" dominant-baseline="central" font-size="12" fill="#5F5E5A">ครบ</text>

<rect x="190" y="440" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="290" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">หยุด — สำเร็จ</text>
<text x="290" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">ตาราง + ผลงาน + สมมติฐาน</text>

<line x1="390" y1="368" x2="448" y2="368" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="419" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">ไม่ครบ</text>

<rect x="450" y="340" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="535" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">ครบ 3 รอบแล้ว?</text>
<text x="535" y="376" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">นับ iteration ที่ทำไป</text>
<line x1="535" y1="396" x2="535" y2="428" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="545" y="412" dominant-baseline="central" font-size="12" fill="#5F5E5A">ใช่</text>
<line x1="535" y1="340" x2="535" y2="298" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="545" y="318" dominant-baseline="central" font-size="12" fill="#5F5E5A">ยังไม่ครบ</text>

<rect x="450" y="240" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="535" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#633806">FAIL ข้อเดิมซ้ำ?</text>
<text x="535" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">2 ครั้งติด ไม่ดีขึ้น</text>
<path d="M535 240 L535 168 L392 168" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="545" y="204" dominant-baseline="central" font-size="12" fill="#5F5E5A">ไม่ใช่</text>
<text x="465" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">รอบถัดไป</text>
<path d="M620 268 L645 268 L645 468 L622 468" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="626" y="254" dominant-baseline="central" font-size="12" fill="#5F5E5A">ใช่</text>

<rect x="450" y="440" width="170" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
<text x="535" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#791F1F">หยุด — ไม่สำเร็จ</text>
<text x="535" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">ครบ 3 รอบ หรือ blocked</text>
</svg>
