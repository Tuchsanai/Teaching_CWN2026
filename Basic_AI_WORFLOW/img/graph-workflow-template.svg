<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#697078" stroke-width="1.4"/></marker></defs><rect width="1200" height="1220" fill="white"/><style>text{font-family:'Noto Sans Thai',Tahoma,sans-serif;fill:#35434c} .title{font-weight:600}</style><text x="600" y="44" text-anchor="middle" font-size="29" style="fill:#35434c">Graph Workflow · โครงสร้างตาม Template 2.2</text><rect x="365" y="80" width="360" height="80" rx="15" fill="#f1eee8" stroke="#88817b" stroke-width="1.5"/><text x="545.0" y="112.0" text-anchor="middle" font-size="22" style="fill:#35434c">INPUT</text><text x="545.0" y="144.0" text-anchor="middle" font-size="22" style="fill:#35434c">โจทย์และข้อมูลต้นทาง</text><path d="M545 160 V200" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="200" width="360" height="90" rx="15" fill="#f1eee8" stroke="#88817b" stroke-width="1.5"/><text x="545.0" y="237.0" text-anchor="middle" font-size="22" style="fill:#35434c">N1 · สกัดข้อกำหนด</text><text x="545.0" y="269.0" text-anchor="middle" font-size="22" style="fill:#35434c">FR / BR จากข้อมูลต้นทาง</text><path d="M545 290 V335 H190 V385" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><path d="M545 290 V335 H485 V385" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><path d="M545 290 V335 H780 V385" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="366" text-anchor="middle" font-size="19" style="fill:#35434c">Fan-out · แยกงานอิสระ N2–N4</text><rect x="60" y="385" width="260" height="95" rx="15" fill="#efebfa" stroke="#8a7eb0" stroke-width="1.5"/><text x="190.0" y="424.5" text-anchor="middle" font-size="22" style="fill:#35434c">N2 · Use Case</text><text x="190.0" y="456.5" text-anchor="middle" font-size="22" style="fill:#35434c">แผนภาพการใช้งาน</text><rect x="355" y="385" width="260" height="95" rx="15" fill="#efebfa" stroke="#8a7eb0" stroke-width="1.5"/><text x="485.0" y="424.5" text-anchor="middle" font-size="22" style="fill:#35434c">N3 · ERD</text><text x="485.0" y="456.5" text-anchor="middle" font-size="22" style="fill:#35434c">แผนภาพข้อมูล</text><rect x="650" y="385" width="260" height="95" rx="15" fill="#efebfa" stroke="#8a7eb0" stroke-width="1.5"/><text x="780.0" y="424.5" text-anchor="middle" font-size="22" style="fill:#35434c">N4 · Sequence</text><text x="780.0" y="456.5" text-anchor="middle" font-size="22" style="fill:#35434c">แผนภาพลำดับงาน</text><path d="M725 245 H1050 V385" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="988" y="285" text-anchor="middle" font-size="18" style="fill:#35434c">เมื่อพบข้อขัดแย้ง</text><rect x="945" y="385" width="215" height="125" rx="15" fill="#fff2da" stroke="#c29c5f" stroke-width="1.5"/><text x="1052.5" y="423.5" text-anchor="middle" font-size="22" style="fill:#35434c">N1b · ทางเลือก</text><text x="1052.5" y="455.5" text-anchor="middle" font-size="22" style="fill:#35434c">ระบุประเด็น</text><text x="1052.5" y="487.5" text-anchor="middle" font-size="22" style="fill:#35434c">ที่ยังสรุปไม่ได้</text><path d="M190 480 V530 H545 V570" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><path d="M485 480 V530 H545 V570" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><path d="M780 480 V530 H545 V570" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><path d="M1050 510 V615 H760" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="975" y="566" text-anchor="middle" font-size="18" style="fill:#35434c">ถ้าถูกเรียกใช้</text><text x="975" y="598" text-anchor="middle" font-size="18" style="fill:#35434c">ต้องเสร็จก่อนรวม</text><rect x="330" y="570" width="430" height="100" rx="15" fill="#e3f3ed" stroke="#699b87" stroke-width="1.5"/><text x="545.0" y="612.0" text-anchor="middle" font-size="22" style="fill:#35434c">N5 · MERGER</text><text x="545.0" y="644.0" text-anchor="middle" font-size="22" style="fill:#35434c">ตรวจความสอดคล้องและรวมผล</text><path d="M545 670 V720" fill="none" stroke="#697078" stroke-width="2" marker-end="url(#arrow)"/><text x="740" y="705" text-anchor="middle" font-size="18" style="fill:#35434c">Fan-in · รวมผล</text><rect x="285" y="720" width="520" height="100" rx="15" fill="#f8eee6" stroke="#b89377" stroke-width="1.5"/><text x="545.0" y="762.0" text-anchor="middle" font-size="22" style="fill:#35434c">หยุดเมื่อ N5 = DONE</text><text x="545.0" y="794.0" text-anchor="middle" font-size="22" style="fill:#35434c">ผลงาน + Execution Trace + ข้อขัดแย้งและหลักฐาน</text><text x="600" y="875" text-anchor="middle" font-size="24" style="fill:#35434c">กติกาที่กำกับทุก Node</text><rect x="45" y="905" width="540" height="120" rx="15" fill="#f7f9fb" stroke="#ccd4dc" stroke-width="1.5"/><text x="315.0" y="941.0" text-anchor="middle" font-size="22" style="fill:#35434c">ทำงานเมื่อ Dependency ทุกตัว DONE</text><text x="315.0" y="973.0" text-anchor="middle" font-size="22" style="fill:#35434c">N2–N4 ใช้ผลจาก N1</text><text x="315.0" y="1005.0" text-anchor="middle" font-size="22" style="fill:#35434c">และไม่เห็นผลของกันและกัน</text><rect x="615" y="905" width="540" height="120" rx="15" fill="#f7f9fb" stroke="#ccd4dc" stroke-width="1.5"/><text x="885.0" y="941.0" text-anchor="middle" font-size="22" style="fill:#35434c">ส่ง node / status / output / assumptions</text><text x="885.0" y="973.0" text-anchor="middle" font-size="22" style="fill:#35434c">MERGER รับเฉพาะ DONE</text><text x="885.0" y="1005.0" text-anchor="middle" font-size="22" style="fill:#35434c">และข้อมูลครบตาม contract</text><rect x="45" y="1045" width="540" height="125" rx="15" fill="#fff5e7" stroke="#d5bc91" stroke-width="1.5"/><text x="315.0" y="1083.5" text-anchor="middle" font-size="22" style="fill:#35434c">ล้มเหลว → ลองใหม่อีก 1 ครั้ง</text><text x="315.0" y="1115.5" text-anchor="middle" font-size="22" style="fill:#35434c">ล้มเหลวซ้ำ → FAILED</text><text x="315.0" y="1147.5" text-anchor="middle" font-size="22" style="fill:#35434c">ทำต่อเฉพาะงานที่ไม่พึ่ง Node ที่ล้มเหลว</text><rect x="615" y="1045" width="540" height="125" rx="15" fill="#f9efef" stroke="#cba2a2" stroke-width="1.5"/><text x="885.0" y="1083.5" text-anchor="middle" font-size="22" style="fill:#35434c">ไม่มี Node ที่ทำต่อได้ → หยุดและรายงานสิ่งที่ขาด</text><text x="885.0" y="1115.5" text-anchor="middle" font-size="22" style="fill:#35434c">ข้อมูลขัดกัน → อ้างหลักฐานจาก INPUT</text><text x="885.0" y="1147.5" text-anchor="middle" font-size="22" style="fill:#35434c">หลักฐานไม่พอ → คงข้อขัดแย้ง ไม่เลือกข้าง</text></svg>