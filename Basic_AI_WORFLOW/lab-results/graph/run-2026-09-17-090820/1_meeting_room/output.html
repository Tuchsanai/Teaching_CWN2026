<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ห้องพร้อม ทีมพร้อม</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#223a4b;font:16px/1.6 "Noto Sans Thai",Tahoma,sans-serif}header{background:#153f4e;color:white;padding:30px 5%}h1{font-size:32px;margin:8px 0}header p{color:#d7e8ed}main{max-width:1240px;margin:auto;padding:26px}h2{font-size:24px;margin:0 0 14px}h3{font-size:19px;margin:8px 0}section{background:white;border:1px solid #dbe4ea;border-radius:18px;margin-bottom:24px;padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid #d2e3e3;border-radius:12px;padding:20px;background:#f8fcfb}.tag{display:inline-block;border-radius:20px;padding:4px 12px;background:#dbf1e8;color:#23604a;font-size:13px}.muted{color:#586f80}.warn{padding:14px 18px;border-left:4px solid #cc9b3c;background:#fff4df;color:#714e1a;border-radius:8px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:13px 12px;border-bottom:1px solid #dce4ea;text-align:left;vertical-align:top}th{background:#eef5f7}label{display:block;font-weight:600}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #b9cbd4;border-radius:8px;font:inherit;color:#223a4b;background:#fafcfd}button{padding:10px 18px;border:0;border-radius:8px;background:#1c735e;color:white;font:inherit;cursor:pointer}button:disabled{background:#dce5e9;color:#536776;cursor:default}button.secondary{background:#edf3f6;color:#284c5d}nav{display:flex;gap:14px;flex-wrap:wrap}nav a{color:inherit;text-decoration:none;border:1px solid #72939c;border-radius:20px;padding:5px 13px}footer{color:#5d7180;text-align:center;padding:24px}input[type=checkbox]{display:inline;width:auto}@media(max-width:680px){main{padding:14px 10px}section{padding:18px}.grid,.form-grid{grid-template-columns:1fr}h1{font-size:25px}header{padding:23px 18px}}</style></head><body><header><span class="tag">GRAPH LAB · ข้อมูลจำลอง</span><h1>ห้องพร้อม ทีมพร้อม</h1><p>ดูเวลาว่างและจัดการนัดหมายในหน้าเดียว · รีเฟรชแล้วกลับข้อมูลตั้งต้น</p><nav><a href="#availability">เวลาว่าง</a><a href="#booking">จองห้อง</a><a href="#status">สถานะ</a></nav></header><main><section><h2>ห้องประชุม</h2><div id="rooms" class="grid"></div></section><section id="availability"><h2 id="availability-title">เวลาว่าง</h2><label>วันที่<input id="date" type="date" value="2026-09-17"></label><p id="slots" class="warn"></p></section><section id="booking"><h2>จองห้องประชุม</h2><form id="booking-form"><div class="form-grid"><label>หัวข้อประชุม<input id="title" required placeholder="ชื่อการประชุม"></label><label>ห้อง<select id="room"><option value="RIVER">River</option><option value="GARDEN">Garden</option><option value="STUDIO">Studio</option></select></label><label>เริ่ม<input id="start" type="time" value="13:00" required></label><label>สิ้นสุด<input id="end" type="time" value="14:00" required></label></div><p><button type="submit">ยืนยันการจอง</button></p></form><p id="message" role="status" aria-live="polite"></p></section><section id="status"><h2>สถานะและการยกเลิก</h2><div class="table-wrap"><table><thead><tr><th>การประชุม</th><th>ห้อง</th><th>เวลา</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="bookings"></tbody></table></div></section></main><footer>ผลงานทดลอง Graph · ข้อมูลจำลองเพื่อการเรียนรู้</footer><script>const rooms=[{id:'RIVER',name:'River',capacity:8},{id:'GARDEN',name:'Garden',capacity:12},{id:'STUDIO',name:'Studio',capacity:4}];
let bookings=[{id:'demo',room:'RIVER',date:'2026-09-17',start:'10:00',end:'11:00',title:'ประชุมตัวอย่าง',status:'ยืนยันแล้ว'}];let selectedRoom='RIVER';let nextId=1;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderRooms(){$('rooms').innerHTML=rooms.map(r=>`<article class="card"><span class="tag">${r.capacity} ที่นั่ง</span><h3>${r.name}</h3><p>ห้องตัวอย่างสำหรับทีมของคุณ</p><button class="availability-button" data-room="${r.id}">ดูเวลาว่าง ${r.name}</button></article>`).join('');document.querySelectorAll('.availability-button').forEach(b=>b.onclick=()=>{selectedRoom=b.dataset.room;$('room').value=selectedRoom;renderAvailability();$('availability').scrollIntoView({behavior:'smooth'});});}
function active(room,date){return bookings.filter(b=>b.room===room&&b.date===date&&b.status==='ยืนยันแล้ว');}
function renderAvailability(){const name=rooms.find(r=>r.id===selectedRoom).name;const list=active(selectedRoom,$('date').value);$('availability-title').textContent='เวลาว่าง · '+name;$('slots').textContent=list.length?'ช่วงที่จองแล้ว: '+list.map(b=>b.start+'–'+b.end).join(', ')+' · ช่วงอื่นว่าง':'ว่างทุกช่วงเวลาในวันที่เลือก';}
function renderBookings(){$('bookings').innerHTML=bookings.filter(b=>b.date===$('date').value).map(b=>`<tr data-booking="${b.id}"><td>${esc(b.title)}</td><td>${esc(b.room)}</td><td>${b.start}–${b.end}</td><td class="status">${b.status}</td><td>${b.status==='ยืนยันแล้ว'?`<button class="secondary cancel-button" data-id="${b.id}">ยกเลิก ${esc(b.title)}</button>`:'—'}</td></tr>`).join('');document.querySelectorAll('.cancel-button').forEach(b=>b.onclick=()=>cancelBooking(b.dataset.id));}
function bookRoom(){const item={id:'b'+nextId,room:$('room').value,date:$('date').value,start:$('start').value,end:$('end').value,title:$('title').value.trim(),status:'ยืนยันแล้ว'};if(!item.title||!item.date||!item.start||!item.end){$('message').textContent='กรอกข้อมูลให้ครบ';return;}if(item.start>=item.end){$('message').textContent='เวลาเริ่มต้องก่อนเวลาสิ้นสุด';return;}if(active(item.room,item.date).some(b=>item.start<b.end&&item.end>b.start)){$('message').textContent='ช่วงเวลานี้ถูกจองแล้ว';return;}nextId++;bookings.push(item);selectedRoom=item.room;renderBookings();renderAvailability();$('message').textContent='จองสำเร็จ';}
function cancelBooking(id){const b=bookings.find(b=>b.id===id);if(b){b.status='ยกเลิกแล้ว';selectedRoom=b.room;renderBookings();renderAvailability();$('message').textContent='ยกเลิกแล้ว และคืนเวลาว่าง';}}
$('booking-form').onsubmit=e=>{e.preventDefault();bookRoom();};$('date').onchange=()=>{renderBookings();renderAvailability();};$('room').onchange=()=>{selectedRoom=$('room').value;renderAvailability();};renderRooms();renderAvailability();renderBookings();
</script></body></html>
